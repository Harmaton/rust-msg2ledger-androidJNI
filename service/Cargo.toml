[package]
name = "service"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
apalis = "1.0.0"
apalis-sqlite = "1.0.0"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
jni = "0.21.1"
msg2ledger-core = { version = "0.1.0", path = "../core" }
 rivium = { version = "0.2.0", features = ["rt"] }
rivium-host = { version = "0.2.0", features = ["embedded", "process"] }
rivium-jni = "0.2.0"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
